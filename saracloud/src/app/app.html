<div class="site">

  <!-- =========================
       NAVIGATION
       ========================= -->
  <header class="navbar">

    <!-- SaraCloud Logo -->
    <a routerLink="/" class="brand">
      <img
        src="/logo.png"
        alt="SaraCloud logo"
        class="logo"
      />
    </a>

    <!-- Mobile Menu Button -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation"
      (click)="menuOpen = !menuOpen"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Links -->
    <nav
      class="navigation"
      [class.mobile-open]="menuOpen"
    >

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="menuOpen = false"
      >
        Home
      </a>

      <a
        routerLink="/about"
        routerLinkActive="active"
        (click)="menuOpen = false"
      >
        About
      </a>

      <a
        routerLink="/skills"
        routerLinkActive="active"
        (click)="menuOpen = false"
      >
        Skills
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        (click)="menuOpen = false"
      >
        Projects
      </a>

      <a
        routerLink="/certificates"
        routerLinkActive="active"
        (click)="menuOpen = false"
      >
        Certifications
      </a>

      <a
        routerLink="/blog"
        routerLinkActive="active"
        (click)="menuOpen = false"
      >
        Blog
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
        (click)="menuOpen = false"
      >
        Contact
      </a>

    </nav>

  </header>


  

  <!-- =========================
       PAGE CONTENT
       ========================= -->
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>


  <!-- =========================
       FOOTER
       ========================= -->
  <footer>
    <p>
     © 2026 SaraCloud. Built with curiosity. Driven by impact.
    </p>
  </footer>

  <!-- =========================
       SCROLL DIRECTION ARROW
       ========================= -->
  <button
    *ngIf="showScrollArrow"
    class="scroll-direction-btn"
    type="button"
    (click)="handleScrollAction()"
    [attr.aria-label]="
      scrollDirection === 'up'
        ? 'Scroll to top'
        : 'Scroll to bottom'
    "
  >
    {{ scrollDirection === 'up' ? '↑' : '↓' }}
  </button>


</div>
